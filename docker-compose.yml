services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: traffic-backend
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://traffic:traffic@postgres:5432/traffic_ai
      TRACI_HOST: sumo
      TRACI_PORT: 8850
      SUMO_HOME: /usr/share/sumo
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./ai-engine/output:/app/ai-engine/output
      - ./sumo:/app/sumo:ro
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      sumo:
        condition: service_started
    restart: unless-stopped
    networks:
      - traffic-net

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: traffic-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - traffic-net

  redis:
    image: redis:7-alpine
    container_name: traffic-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - traffic-net

  postgres:
    image: postgis/postgis:16-3.4
    container_name: traffic-postgres
    environment:
      POSTGRES_DB: traffic_ai
      POSTGRES_USER: traffic
      POSTGRES_PASSWORD: traffic
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic -d traffic_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - traffic-net

  sumo:
    image: eclipse/sumo:latest
    container_name: traffic-sumo
    working_dir: /app/sumo
    command:
      - sumo
      - -c
      - dhanbad.sumocfg
      - --step-length
      - "1"
      - --no-warnings
      - "true"
      - --collision.action
      - warn
      - --remote-port
      - "8850"
      - --num-clients
      - "1"
    ports:
      - "8850:8850"
    volumes:
      - ./sumo:/app/sumo:ro
    restart: unless-stopped
    networks:
      - traffic-net

volumes:
  redis-data:
  postgres-data:

networks:
  traffic-net:
    driver: bridge
